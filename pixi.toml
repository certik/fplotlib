[workspace]
authors = ["Ondřej Čertík <ondrej@certik.us>"]
channels = ["conda-forge"]
name = "fplot"
platforms = ["osx-arm64", "linux-64"]
version = "0.1.0"

[tasks]
build-flang = "bash scripts/build_flang.sh"
# Run binaries from repo root so relative paths like tests/out/*.svg resolve.
test-flang = "bash scripts/build_flang.sh && mkdir -p tests/out && ./build/flang/test_plots"
demo-flang = "bash scripts/build_flang.sh && ./build/flang/demo"

# fpm is how another project depends on fplot, so build it that way too.
fpm-flang = "fpm build --compiler flang"

mpl-refs = "python tests/gen_mpl_refs.py"

# The five comparisons share their setup, so it is expressed once as a
# dependency rather than repeated in each command and run five times.
[tasks.compare]
cmd = "python tests/compare_svgs.py"
depends-on = ["mpl-refs", "test-flang"]

[tasks.compare-png]
cmd = "python tests/compare_pngs.py"
depends-on = ["mpl-refs", "test-flang"]

[tasks.compare-pdf]
cmd = "python tests/compare_pdfs.py"
depends-on = ["mpl-refs", "test-flang"]

[tasks.compare-eps]
cmd = "python tests/compare_eps.py"
depends-on = ["mpl-refs", "test-flang"]

[tasks.compare-gif]
cmd = "python tests/compare_gif.py"
depends-on = ["mpl-refs", "test-flang"]

[dependencies]
python = ">=3.14.6,<3.15"
matplotlib = ">=3.11.1,<4"
numpy = ">=2.5.1,<3"
cairosvg = ">=2.9.0,<3"
pillow = ">=12.3.0,<13"
# pdftoppm, for rasterizing PDFs in tests/compare_pdfs.py
poppler = "*"
# gs, for rasterizing EPS in tests/compare_eps.py
ghostscript = ">=10.4.0,<11"
fpm = ">=0.13.0,<0.14"

# flang and LFortran live in separate environments: conda-forge builds
# LFortran against clang 21 and flang against clang 22, which cannot be
# installed side by side. `pixi run test-lfortran` picks the lfortran
# environment by itself, since its tasks are defined only there.
[feature.flang.target.linux-64.dependencies]
flang_linux-64 = ">=22,<23"

[feature.lfortran.dependencies]
lfortran = ">=0.66.0,<0.67"

[feature.lfortran.tasks]
build-lfortran = "bash scripts/build_lfortran.sh"
test-lfortran = "bash scripts/build_lfortran.sh && mkdir -p tests/out && ./build/lfortran/test_plots"
demo-lfortran = "bash scripts/build_lfortran.sh && ./build/lfortran/demo"
fpm-lfortran = "fpm build --compiler lfortran"

[environments]
default = ["flang"]
lfortran = ["lfortran"]
