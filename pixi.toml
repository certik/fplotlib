[workspace]
authors = ["Ondřej Čertík <ondrej@certik.us>"]
channels = ["conda-forge"]
name = "fplot"
platforms = ["osx-arm64", "linux-64"]
version = "0.1.0"

# One environment per compiler, holding nothing but the compiler and fpm, so
# the tests need no Python; the matplotlib comparison has an environment of
# its own. Every task is defined in exactly one environment, so
# `pixi run test-lfortran` picks the lfortran environment without being told,
# and installs it the first time.

[dependencies]
fpm = ">=0.13.0,<0.14"

[feature.gfortran.dependencies]
gfortran = ">=16,<17"

[feature.gfortran.tasks]
test-gfortran = "fpm test --compiler gfortran"
# -O3 with fused multiply-add allowed: the rounding then differs from the
# plain build, and the pictures must not.
test-gfortran-O3 = "fpm test --compiler gfortran --flag '-O3 -march=native'"
demo-gfortran = "fpm run --example demo --compiler gfortran"

# conda-forge has flang for Linux only; on macOS provide a system flang on
# PATH. The compiler is a feature of its own because the matplotlib
# environment needs it as well, while the tasks belong to the flang
# environment alone.
[feature.flang.target.linux-64.dependencies]
flang_linux-64 = ">=22,<23"

[feature.flang-tasks.tasks]
test-flang = "fpm test --compiler flang"
test-flang-O3 = "fpm test --compiler flang --flag '-O3 -march=native'"
demo-flang = "fpm run --example demo --compiler flang"

# LFortran cannot share an environment with flang: conda-forge builds it
# against clang 21 and flang against clang 22.
[feature.lfortran.dependencies]
lfortran = ">=0.66.0,<0.67"

[feature.lfortran.tasks]
test-lfortran = "fpm test --compiler lfortran"
demo-lfortran = "fpm run --example demo --compiler lfortran"

[feature.matplotlib.dependencies]
python = ">=3.14.6,<3.15"
matplotlib = ">=3.11.1,<4"
numpy = ">=2.5.1,<3"
cairosvg = ">=2.9.0,<3"
pillow = ">=12.3.0,<13"
# pdftoppm, for rasterizing PDFs in tests/compare_pdfs.py
poppler = "*"
# gs, for rasterizing EPS in tests/compare_eps.py
ghostscript = ">=10.4.0,<11"

# The comparisons read the matplotlib references from tests/refs and the
# flang build's pictures from tests/out. Both are made once: the inputs and
# outputs let pixi skip them when nothing they depend on has changed, so the
# five comparisons, run one after another, share one build.
[feature.matplotlib.tasks.mpl-refs]
cmd = "python tests/gen_mpl_refs.py"
inputs = ["tests/gen_mpl_refs.py"]
outputs = ["tests/refs/*"]

[feature.matplotlib.tasks.test-outputs]
cmd = "fpm test --compiler flang"
inputs = ["fpm.toml", "src/*.f90", "tests/*.f90", "tests/fingerprints.txt"]
outputs = ["tests/out/*"]

[feature.matplotlib.tasks.compare]
cmd = "python tests/compare_svgs.py"
depends-on = ["mpl-refs", "test-outputs"]

[feature.matplotlib.tasks.compare-png]
cmd = "python tests/compare_pngs.py"
depends-on = ["mpl-refs", "test-outputs"]

[feature.matplotlib.tasks.compare-pdf]
cmd = "python tests/compare_pdfs.py"
depends-on = ["mpl-refs", "test-outputs"]

[feature.matplotlib.tasks.compare-eps]
cmd = "python tests/compare_eps.py"
depends-on = ["mpl-refs", "test-outputs"]

[feature.matplotlib.tasks.compare-gif]
cmd = "python tests/compare_gif.py"
depends-on = ["mpl-refs", "test-outputs"]

[feature.matplotlib.tasks.compare-all]
depends-on = ["compare", "compare-png", "compare-pdf", "compare-eps", "compare-gif"]

[environments]
gfortran = ["gfortran"]
flang = ["flang", "flang-tasks"]
lfortran = ["lfortran"]
matplotlib = ["flang", "matplotlib"]
