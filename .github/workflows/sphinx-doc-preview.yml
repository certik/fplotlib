name: Build Sphinx Documentation Preview

on:
  push:
    paths:
      - 'docs/**'
      - 'README.md'
      - '.github/workflows/**'
      # The gallery builds the library and runs its examples.
      - 'src/**'
      - 'fpm.toml'
  pull_request:
    paths:
      - 'docs/**'
      - 'README.md'
      - '.github/workflows/**'
      - 'src/**'
      - 'fpm.toml'

env:
  LANG: "en_US.UTF-8"
  LC_ALL: "en_US.UTF-8"
  PIP_DISABLE_PIP_VERSION_CHECK: "ON"
  PIP_NO_CLEAN: "ON"
  PIP_PREFER_BINARY: "ON"
  TZ: "UTC"

jobs:
  Build-Sphinx-Docs:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure GitHub Pages
        if: github.event_name == 'push' && github.ref_name == 'sphinx' && github.repository != 'certik/fplotlib'
        uses: actions/configure-pages@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # The gallery in docs/gallery is built and run during the docs build, so
      # the same toolchain the tests use has to be here too.
      - name: Set up GFortran
        id: fortran
        uses: fortran-lang/setup-fortran@v2.0.0-beta.10
        with:
          compiler: gfortran
          version: latest

      - uses: fortran-lang/setup-fpm@v10
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: |
          pip install -r docs/requirements.txt
          python --version
          sphinx-build --version
          ford --version

      - name: Build Docs
        env:
          # Picked up by docs/conf.py as fplotlib_gallery_compiler.
          FPM_FC: ${{ steps.fortran.outputs.fc }}
        run: |
          sphinx-build -W -b html docs docs/_build/html

      - name: Upload Documentation
        uses: actions/upload-artifact@v4
        with:
          name: sphinx-html-preview
          path: ./docs/_build/html/

      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref_name == 'sphinx' && github.repository != 'certik/fplotlib'
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./docs/_build/html/

  Deploy-Sphinx-Docs:
    if: github.event_name == 'push' && github.ref_name == 'sphinx' && github.repository != 'certik/fplotlib'
    needs: Build-Sphinx-Docs
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Sphinx preview
        id: deployment
        uses: actions/deploy-pages@v4
