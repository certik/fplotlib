name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # One job per compiler, each with nothing installed but that compiler and
  # fpm. `fpm test` builds the package, writes every test plot and checks it
  # against tests/fingerprints.txt.
  gfortran:
    name: GFortran
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.10.1
        with:
          pixi-version: v0.76.1
          cache: true
          locked: true
          environments: gfortran
      - name: Test
        run: pixi run test-gfortran
      - name: Test with -O3 -march=native
        run: pixi run test-gfortran-O3
      - name: Demo
        run: pixi run demo-gfortran

  flang:
    name: Flang
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.10.1
        with:
          pixi-version: v0.76.1
          cache: true
          locked: true
          environments: flang
      - name: Test
        run: pixi run test-flang
      - name: Test with -O3 -march=native
        run: pixi run test-flang-O3
      - name: Demo
        run: pixi run demo-flang

  lfortran:
    name: LFortran
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.10.1
        with:
          pixi-version: v0.76.1
          cache: true
          locked: true
          environments: lfortran
      - name: Test
        run: pixi run test-lfortran
      - name: Demo
        run: pixi run demo-lfortran

  # The pictures of the flang build against matplotlib's. The first step makes
  # the references and the pictures; the comparisons after it reuse both.
  matplotlib:
    name: Matplotlib comparison (Flang)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.10.1
        with:
          pixi-version: v0.76.1
          cache: true
          locked: true
          environments: matplotlib
      - name: Matplotlib references and flang pictures
        run: pixi run mpl-refs && pixi run test-outputs
      - name: Compare SVG
        run: pixi run compare
      - name: Compare PNG
        run: pixi run compare-png
      - name: Compare PDF
        run: pixi run compare-pdf
      - name: Compare EPS
        run: pixi run compare-eps
      - name: Compare GIF
        run: pixi run compare-gif
